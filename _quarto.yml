project:
  type: website
  output-dir: _site
  resources:
    - custom-styles.css
    - food-systems/dashboard/**

execute:
  freeze: auto

filters:
  - webr

# Meta
description-meta: "Academic website for Dr. David Contreras-Loya"
author-meta: "Dr. David Contreras-Loya"

website:
  title: "David Contreras-Loya"
  description: "Research Professor at Escuela de Gobierno y Transformación Pública, Tecnológico de Monterrey"
  site-url: https://dcloya.com
  repo-url: https://github.com/dcloya/dcloya.com
  
  open-graph:
    title: "David Contreras-Loya, PhD"
    description: "Applied economist, researcher, and educator working at the intersection of health, education, and social policy"
    image: https://dcloya.com/files/AGT_5639.png
    locale: en_US
    site-name: "David Contreras-Loya"

  twitter-card:
    title: "David Contreras-Loya, PhD"
    description: "Research Professor at Tecnológico de Monterrey specializing in health economics and public policy"
    image: https://dcloya.com/files/AGT_5639.png
    card-style: summary_large_image
  
  # Search configuration
  search:
    location: navbar
    type: textbox

  navbar:
    background: light
    left:
      - text: About
        menu:
          - text: Contact
            href: contact.qmd
          - text: CV
            href: cv.qmd
      - text: Research
        menu:
          - text: "Sistemas alimentarios (dashboard)"
            href: food-systems-dashboard.qmd
      
      # --- TEACHING SECTION (por curso) ---
      - text: Teaching
        menu:
          - text: "Ver todos los cursos"
            href: teaching.qmd
          - text: "---"
          - text: "Estadística Matemática (2026)"
            href: notes/estadistica_matematica_2026/index.qmd
          - text: "Métodos Cuantitativos (2026)"
            href: notes/metodos_cuantitativos_2026/index.qmd

    right: 
      - text: CV
        href: files/Contreras_D_academic_CV_2026.pdf
      - icon: github
        href: https://github.com/dcloya
        target: _blank
      - icon: mortarboard
        href: https://scholar.google.es/citations?user=axuzNJ0AAAAJ
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/david-contreras-loya-8550bb44
        target: _blank   

  page-navigation: true
  
  page-footer: 
    left: "[David Contreras-Loya](https://egobiernoytp.tec.mx/es/sobre-egob/facultad-investigadores/perfil-asociados/david-contreras-loya) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Built on [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template)"
    right:  
      - icon: github
        href: https://github.com/dcloya
        target: _blank
      - icon: mortarboard
        href: https://scholar.google.es/citations?user=axuzNJ0AAAAJ
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/david-contreras-loya-8550bb44
        target: _blank   

  reader-mode: true
  draft-mode: unlinked
  
  google-analytics:
    tracking-id: "G-CRLS583RW9"
    anonymize-ip: true

format:
  html:
    theme: cosmo
    css: custom-styles.css
    toc: false
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
