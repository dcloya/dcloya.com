  .tile {

    stroke: #1a1a2e;
    stroke-width: 2.5px;
  }
  .tile-label {
    font-size: 9.5px;
    font-weight: 600;
    fill: #fff;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .tile-value {
    font-size: 8px;
    font-weight: 400;
    fill: rgba(255,255,255,0.9);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .legend-bar {
    display: flex;
    align-items: center;
    margin-top: 12px;
    gap: 8px;
  }
  .legend-gradient {
    height: 10px;
    flex: 1;
    border-radius: 5px;
  }
  .legend-label {
    font-size: 11px;
    color: #666;
    white-space: nowrap;
  }
  .tooltip-box {
    position: absolute;
    pointer-events: none;
    background: rgba(26,26,46,0.95);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.5;
    max-width: 220px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  .tooltip-box .tt-state {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .tooltip-box .tt-marg {
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 6px;
  }
  .footnote {
    font-size: 11px;
    color: #888;
    margin-top: 16px;
    line-height: 1.5;
    border-top: 1px solid #e0e0e0;
    padding-top: 10px;

  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%")
  .style("max-width", width + "px");

const tooltip = d3.select("#tooltip");

const dataMap = {};
data.forEach(d => { if(d.estado !== "Nacional") dataMap[d.estado] = d; });

const tiles = svg.selectAll(".tile-g")
  .data(Object.entries(tileGrid))
  .enter().append("g")
  .attr("class","tile-g")
  .attr("transform", d => {
    const [row, col] = d[1];
    return `translate(${margin.left + col * (tileSize+tileGap)}, ${margin.top + row * (tileSize+tileGap)})`;
  });

tiles.append("rect")
  .attr("class","tile")
  .attr("width", tileSize)
  .attr("height", tileSize)
  .attr("rx", 6)
  .attr("ry", 6)
  .attr("stroke", "#fff")
  .attr("stroke-width", 1.5);

tiles.append("text")
  .attr("class","tile-label")
  .attr("x", tileSize/2)
  .attr("y", tileSize/2 - 6)
  .text(d => abbrev[d[0]] || d[0].slice(0,3).toUpperCase());

tiles.append("text")
  .attr("class","tile-value")
  .attr("x", tileSize/2)
  .attr("y", tileSize/2 + 9);

// Controls
const ctrlDiv = d3.select("#controls");
indicators.forEach((ind, i) => {
  ctrlDiv.append("button")
    .text(ind.label)
    .attr("data-idx", i)
    .classed("active", i === 0)
    .on("click", function() {
      ctrlDiv.selectAll("button").classed("active", false);
      d3.select(this).classed("active", true);
      update(i);
    });
});

function update(idx) {
  const ind = indicators[idx];
  const vals = Object.values(dataMap).map(d => d[ind.key]).filter(v => v != null);
  const ext = d3.extent(vals);

  const schemes = {
    "OrRd": d3.interpolateOrRd,
    "YlOrRd": d3.interpolateYlOrRd,
    "Reds": d3.interpolateReds,
    "Greens": d3.interpolateGreens,
    "PuRd": d3.interpolatePuRd,
  };
  const interp = schemes[ind.palette] || d3.interpolateOrRd;
  const colorScale = d3.scaleSequential()
    .domain(ind.invert ? [ext[1], ext[0]] : ext)
    .interpolator(interp);

  tiles.select("rect")
    .transition().duration(400)
    .attr("fill", d => {
      const v = dataMap[d[0]] ? dataMap[d[0]][ind.key] : null;
      return v != null ? colorScale(v) : "#e0e0e0";
    });

  tiles.select(".tile-value")
    .text(d => {
      const v = dataMap[d[0]] ? dataMap[d[0]][ind.key] : null;
      if (v == null) return "—";
      return ind.key === "desnutricion_18" ? (v*100).toFixed(1)+"%" : v.toFixed(1)+"%";
    });

  // Legend
  const gradStops = d3.range(0, 1.01, 0.02).map(t => {
    const v = ext[0] + t * (ext[1] - ext[0]);
    return colorScale(v);
  });
  d3.select("#legend-grad").style("background", `linear-gradient(to right, ${gradStops.join(",")})`);

  const fmt = ind.key === "desnutricion_18" ? v => (v*100).toFixed(0)+"%" : v => v.toFixed(0)+"%";
  d3.select("#legend-lo").text(fmt(ext[0]));
  d3.select("#legend-hi").text(fmt(ext[1]));

  // Footnote
  d3.select("#footnote").html(
    `<strong>${ind.desc}</strong> (${ind.year}). Fuente: ${ind.source}. ` +
    `Grado de marginación: CONAPO (2020). Datos a nivel de entidad federativa (n=32).`
  );

  // Tooltip
  tiles.on("mouseenter", function(event, d) {
    const dd = dataMap[d[0]];
    if(!dd) return;
    const v = dd[ind.key];
    const vFmt = v == null ? "Sin dato" : (ind.key === "desnutricion_18" ? (v*100).toFixed(1)+"%" : v.toFixed(1)+"%");
    tooltip.html(
      `<div class="tt-state">${d[0]}</div>` +
      `<div class="tt-marg">Marginación: ${dd.marginacion || "—"}</div>` +
      `${ind.label}: <strong>${vFmt}</strong>`
    ).style("opacity", 1);
  })
  .on("mousemove", function(event) {
    const container = document.getElementById("chart").getBoundingClientRect();
    tooltip
      .style("left", (event.clientX - container.left + 14) + "px")
      .style("top", (event.clientY - container.top - 10) + "px");
  })
  .on("mouseleave", () => tooltip.style("opacity", 0));
}

update(0);

})();
</script>
</body>
</html>
